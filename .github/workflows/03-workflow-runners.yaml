name: 03 - Workflow Runners
on: push
jobs:
    ubuntu-echo:
        runs-on: ubuntu-latest
        steps:
            - name: Show OS
              run: |
                echo "I'm running on an Ubuntu runner" 
                echo "Running OS: $RUNNER_OS"
    windows-echo:
        runs-on: windows-latest
        steps:
            - name: Show OS
              shell: bash
              run: |
                echo "I'm running on a Windows runner" 
                echo "Running OS: $RUNNER_OS"
            
